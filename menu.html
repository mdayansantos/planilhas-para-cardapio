<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Visualize o cardápio dos restaurantes por categoria e dia."
    />
    <title>Cardápio</title>
  </head>
  <body class="menu-page">
    <main class="page tv-menu-screen">
      <h1 class="visually-hidden">Cardápio dos restaurantes</h1>
      <select id="day-select" class="visually-hidden" aria-label="Dia do cardápio"></select>
      <section id="menu-section" class="menu-section" aria-label="Cardápio" hidden>
        <p id="menu-summary" class="visually-hidden"></p>
        <div
          id="menu-content"
          class="menu-table-wrap"
          role="region"
          aria-label="Tabela de categorias e restaurantes"
          tabindex="0"
        ></div>
      </section>

      <section id="empty-state" class="empty-state" aria-labelledby="empty-title" hidden>
        <h2 id="empty-title">Cardápio não carregado :(</h2>
        <p id="empty-message" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/menu.js"></script>
  </body>
</html>
